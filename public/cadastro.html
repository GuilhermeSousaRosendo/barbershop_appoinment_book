<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | BarberTime</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav" id="nav"></header>
  <main>
    <div class="card">
      <h2>Criar conta</h2>
      <form id="form">
        <input id="nome" placeholder="Nome completo" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <select id="tipo">
          <option value="cliente">Sou cliente</option>
          <option value="barbeiro">Sou barbeiro</option>
        </select>
        <button class="btn">Criar conta</button>
      </form>
      <p class="msg" id="msg"></p>
      <p class="hint">Já tem conta? <a href="login.html"><b>Entrar</b></a></p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    navbar();
    $('#form').onsubmit = async e => {
      e.preventDefault();
      try {
        const user = await api('/cadastro', { method: 'POST', body: {
          nome: $('#nome').value, email: $('#email').value, senha: $('#senha').value, tipo: $('#tipo').value
        }});
        entrar(user);
        location.href = user.tipo === 'barbeiro' ? 'horarios.html' : 'agendar.html';
      } catch (err) { $('#msg').textContent = err.message; }
    };
  </script>
</body>
</html>
